services:
  postgres_db:
    container_name: trelloIdentityPostgresDB
    image: postgres:15.3

    ports:
      - "5432:5432"

    volumes:
      - ./dbfiles:/docker-entrypoint-initdb.d
      - ./postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: trelloIdentity