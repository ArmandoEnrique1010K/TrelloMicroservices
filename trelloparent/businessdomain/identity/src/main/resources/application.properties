spring.application.name=businessdomain-identity
server.port = 8081
server.servlet.context-path=/business/v1

# TODO: INVESTIGAR ESTA LINEA
spring.config.import=optional:configserver:http://localhost:8888

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.paths-to-match=/user/**

# PostgreSQL 
spring.datasource.url=jdbc:postgresql://localhost:5432/identity_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

