spring.application.name=businessdomain-identity
server.port = 8081
server.servlet.context-path=/business/v1

# spring.config.import=optional:configserver:http://localhost:8888

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Rutas a coincidir (muy reestrictivo)
# springdoc.paths-to-match=/auth/**,/profile/**,/token/**,/user/**

# PostgreSQL 
spring.datasource.url=jdbc:postgresql://localhost:5432/identity_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# KEYS
# Ubicaciones de las llaves publicas y privadas
jwt.private-key-path=../../infrastructure/keys/private-key.pem
jwt.public-key-path=../../infrastructure/keys/public-key.pem

# SECURITY
# logging.level.org.springframework.security=DEBUG

# RESEND - Envio de emails al correo 'real' del usuario
# API Key generada desde el dashboard de Resend.
# Se utiliza para autenticar las solicitudes realizadas a la API de Resend.
resend.api.key=

# Dirección de remitente proporcionada por Resend para realizar pruebas.
# Restricción: utilizando onboarding@resend.dev, solamente se pueden enviar
# correos al email asociado a la cuenta de Resend.

# Para enviar correos a destinatarios externos en un entorno de producción, 
# es necesario verificar un dominio propio y utilizar una dirección perteneciente 
# a él (requiere hacer un pago con tarjeta de credito para registrar un dominio).
resend.test.domain=onboarding@resend.dev

# JWT INTERNO
services.clients.project.username=project-service
services.clients.project.password=12345
# services.clients.project.password=${PROJECT_SERVICE_SECRET}