spring.application.name=businessdomain-project
server.port = 8082
server.servlet.context-path=/business/v1

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# PostgreSQL 
spring.datasource.url=jdbc:postgresql://localhost:5433/project_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SECURITY
# Ubicación del archivo de la llave publica
spring.security.oauth2.resourceserver.jwt.public-key-location=file:../../infrastructure/keys/public-key.pem

# URL del dominio del microservicio Identity
# incluye el context path
services.identity.url=http://localhost:8081/business/v1
# URL del dominio del microservicio Workflow
services.workflow.url=http://localhost:8083/business/v1


# Apache HTTP CLIENT
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.httpclient.enabled=true

# ============================================================
# Resilience4j - Circuit Breaker con OpenFeign
# ============================================================

# OpenFeign genera automáticamente un nombre para cada método
# del cliente Feign. En este proyecto se personaliza mediante
# CircuitBreakerNameResolver para utilizar el siguiente formato:
#
# <nombre definido en @FeignClient>_<nombre del método>
#
# Ejemplo:
# businessdomain-identity-query_findUsersByIds
#
# Este nombre debe coincidir con el nombre utilizado en la
# configuración de la instancia de Resilience4j.

#
# Si las llamadas a Identity presentan una tasa de fallos
# suficientemente alta, el Circuit Breaker pasa de CLOSED a OPEN.
#
# Mientras permanece OPEN, las nuevas llamadas son rechazadas
# inmediatamente por el Circuit Breaker y no se intenta contactar
# con Identity.
#
# En este proyecto, el rechazo termina siendo gestionado por el
# fallback configurado en el cliente OpenFeign, que posteriormente
# traduce el fallo de infraestructura a ServiceUnavailableException.

# ------------------------------------------------------------
# Timeouts de OpenFeign
# ------------------------------------------------------------

# Timeout de conexión:
# Tiempo máximo, en milisegundos, que OpenFeign espera para
# establecer una conexión con el microservicio Identity.
#
# Si Identity no acepta la conexión dentro de este tiempo,
# la llamada falla.
spring.cloud.openfeign.client.config.businessdomain-identity-query_findUsersByIds.connect-timeout=2000

# Timeout de lectura:
# Tiempo máximo, en milisegundos, que OpenFeign espera para
# recibir datos después de haber establecido la conexión
# con Identity.
#
# Si Identity no responde dentro de este tiempo, la llamada
# falla.
spring.cloud.openfeign.client.config.businessdomain-identity-query_findUsersByIds.read-timeout=3000

# En conjunto, estos timeouts evitan que Project permanezca
# esperando indefinidamente una respuesta de Identity.
#
# Los timeouts de OpenFeign determinan cuánto tiempo se espera
# por una llamada individual; el Circuit Breaker, por su parte,
# determina cuándo dejar de realizar llamadas debido a un
# comportamiento repetidamente fallido.

# ------------------------------------------------------------
# Integración de OpenFeign con Circuit Breaker
# ------------------------------------------------------------

# Habilita el uso de Circuit Breaker para las llamadas realizadas
# mediante clientes OpenFeign.
spring.cloud.openfeign.circuitbreaker.enabled=true


# ============================================================
# Configuración del Circuit Breaker
# ============================================================

# Instancia:
# businessdomain-identity-query_findUsersByIds
#
# Esta instancia protege las llamadas realizadas por el método
# findUsersByIds() del IdentityQueryClient.


# Tipo de ventana utilizada para registrar y evaluar las llamadas.
#
# COUNT_BASED utiliza una cantidad fija de llamadas recientes
# para calcular la tasa de fallos.
resilience4j.circuitbreaker.instances.businessdomain-identity-query_findUsersByIds.sliding-window-type=count-based

# Cantidad de llamadas que puede contener la ventana de evaluación.
#
# En este caso, Resilience4j considera las últimas 10 llamadas
# registradas para calcular la tasa de fallos.
resilience4j.circuitbreaker.instances.businessdomain-identity-query_findUsersByIds.sliding-window-size=10

# Cantidad mínima de llamadas necesarias antes de que el
# Circuit Breaker pueda calcular la tasa de fallos.
#
# Con un valor de 5, las primeras 4 llamadas no son suficientes
# para determinar si el circuito debe abrirse.
resilience4j.circuitbreaker.instances.businessdomain-identity-query_findUsersByIds.minimum-number-of-calls=5

# Porcentaje de fallos necesario para que el Circuit Breaker
# pase del estado CLOSED al estado OPEN.
#
# Con un valor de 50, el circuito se abre cuando la tasa de
# fallos es igual o superior al 50%, siempre que se haya
# alcanzado el número mínimo de llamadas.
resilience4j.circuitbreaker.instances.businessdomain-identity-query_findUsersByIds.failure-rate-threshold=50

# Tiempo durante el cual el Circuit Breaker permanece en OPEN.
#
# Una vez transcurridos 10 segundos, pasa a HALF_OPEN para
# permitir llamadas de prueba.
resilience4j.circuitbreaker.instances.businessdomain-identity-query_findUsersByIds.wait-duration-in-open-state=10s

# Cantidad máxima de llamadas permitidas mientras el Circuit
# Breaker se encuentra en HALF_OPEN.
#
# Estas llamadas sirven para comprobar si Identity vuelve a estar
# disponible.
#
# Si las llamadas de prueba tienen éxito, el Circuit Breaker
# puede regresar a CLOSED. Si vuelven a fallar, puede regresar
# a OPEN.
resilience4j.circuitbreaker.instances.businessdomain-identity-query_findUsersByIds.permitted-number-of-calls-in-half-open-state=3


# ============================================================
# Monitorización y diagnóstico
# ============================================================

# Logs detallados de los eventos del Circuit Breaker.
#
# Se puede habilitar temporalmente para depuración.
# Para monitorización habitual es preferible utilizar Actuator.
# logging.level.io.github.resilience4j.circuitbreaker=DEBUG

# Expone los endpoints de Actuator necesarios para consultar
# el estado y los eventos registrados por los Circuit Breakers.
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents

# ------------------------------------------------------------
# Endpoints de Actuator
# ------------------------------------------------------------

# Estado actual de los Circuit Breakers:
#
# http://localhost:8082/business/v1/actuator/circuitbreakers
#
# Permite consultar información como:
# - estado actual (CLOSED, OPEN, HALF_OPEN)
# - llamadas registradas
# - llamadas fallidas
# - tasa de fallos
# - llamadas rechazadas por el Circuit Breaker


# Eventos registrados por los Circuit Breakers:
#
# http://localhost:8082/business/v1/actuator/circuitbreakerevents
#
# Permite consultar eventos como:
# - SUCCESS
# - ERROR
# - estado del Circuit Breaker
# - transiciones entre estados


# Logs detallados de OpenFeign y Resilience4j.
#
# Útiles para depuración puntual; normalmente se mantienen
# deshabilitados para evitar ruido innecesario en la consola.
# logging.level.org.springframework.cloud.openfeign=DEBUG
# logging.level.io.github.resilience4j=DEBUG


# ------------------------------------------------------------
# Identificadores de Circuit Breaker generados por OpenFeign
# ------------------------------------------------------------

# Habilita la generación de identificadores compatibles con las
# propiedades de configuración de Circuit Breaker.
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true