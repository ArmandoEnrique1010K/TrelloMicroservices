spring.application.name=businessdomain-workflow
server.port = 8083
server.servlet.context-path=/business/v1

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# PostgreSQL 
spring.datasource.url=jdbc:postgresql://localhost:5434/workflow_db?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SECURITY
# Ubicación del archivo de la llave publica
spring.security.oauth2.resourceserver.jwt.public-key-location=file:../../infrastructure/keys/public-key.pem

# URL del dominio del microservicio Identity
# incluye el context path
services.identity.url=http://localhost:8081/business/v1

# Apache HTTP CLIENT
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.httpclient.enabled=true

# RESILIENCE4J
spring.cloud.openfeign.client.config.businessdomain-identity-user-query.connect-timeout=2000
spring.cloud.openfeign.client.config.businessdomain-identity-user-query.read-timeout=3000
resilience4j.circuitbreaker.instances.businessdomain-identity-user-query.sliding-window-type=count-based
resilience4j.circuitbreaker.instances.businessdomain-identity-user-query.sliding-window-size=10
resilience4j.circuitbreaker.instances.businessdomain-identity-user-query.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.businessdomain-identity-user-query.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.businessdomain-identity-user-query.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.businessdomain-identity-user-query.permitted-number-of-calls-in-half-open-state=3

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries,retryevents,mappings

spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true
resilience4j.retry.instances.businessdomain-identity-user-query.max-attempts=3
resilience4j.retry.instances.businessdomain-identity-user-query.wait-duration=500ms
resilience4j.retry.instances.businessdomain-identity-user-query.retry-exceptions=com.trello.workflow.exception.ServiceUnavailableException
logging.level.io.github.resilience4j.retry=DEBUG
